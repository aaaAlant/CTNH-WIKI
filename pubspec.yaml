name: ctnh_wiki
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.1
  flutter_markdown_plus: ^1.0.7
  url_launcher: ^6.3.2
  intl: ^0.20.2
  three_js: ^0.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/ModsList.json
    - assets/generated/quests/
    - assets/docs/guides/
    - assets/images/home/
    - assets/images/home/tech/
    - assets/images/home/magic/
    - assets/images/home/adventure/
    - assets/images/home/team/
    - assets/images/wiki/formal/
    - assets/images/gui/
    - assets/icons/app/
    - assets/icons/home/
    - assets/textures/modules/auto/
    - assets/textures/modules/auto/icons/
    - assets/models/modules/auto/


